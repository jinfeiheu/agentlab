[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-graph-demo"
version = "0.1.0"
description = "LangChain / LangGraph 终端学习示例"
requires-python = ">=3.10"
dependencies = [
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-deepseek>=1.1,<2",
  "langchain-ollama>=1.1,<2",
  "langgraph>=1.2,<2",
  "langchain-text-splitters>=1.1,<2",
  "numpy>=1.26",
  "pyjwt>=2.10,<3",
  "python-dotenv>=1.2",
  "tiktoken>=0.14",
  "sqlglot>=30.27.0",
  "faker>=40.44.0",
  "pyyaml>=6.0",
]

[project.scripts]
agentlab = "agentlab.cli:main"
agentlab-api = "agentlab.api.app:serve"
agentlab-mcp-knowledge = "agentlab.mcp.knowledge_server:main"
agentlab-mcp-utils = "agentlab.mcp.utils_server:main"
agentlab-analytics = "agentlab.analytics.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.4", "httpx>=0.28"]
observability = [
  "openinference-instrumentation-langchain>=0.1.79,<0.2",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
]
serve = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "psycopg[binary,pool]>=3.2",
]
rag = [
  "langchain-postgres>=0.0.19",
  "psycopg[binary]>=3.2",
  "rank-bm25>=0.2.2",
  "jieba>=0.42",
  "sentence-transformers>=3.0",
  "torch>=2.2",
]
mcp = ["mcp>=1.24,<2", "langchain-mcp-adapters>=0.3,<0.4"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["agentlab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: 需要真实 Postgres/Ollama 等外部服务的集成测试",
]

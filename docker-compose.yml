services:
  db:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: agentlab-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/seed_demo.sql:/docker-entrypoint-initdb.d/seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentlab"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: agentlab-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/agentlab
      USE_DB: "true"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me-please-replace-me}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

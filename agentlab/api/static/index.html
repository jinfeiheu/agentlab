<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Interview Lab</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #171a21;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --border: #2a2f3a;
    --tool: #8b93a7;
    --error: #ff6b6b;
    --ok: #61d095;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0d0f14;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .session-field { display: flex; gap: 6px; }
  .session-field input { flex: 1; min-width: 0; }
  .session-field button { padding: 9px 12px; white-space: nowrap; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  button {
    padding: 9px 16px;
    border-radius: 8px;
    border: 0;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status { font-size: 13px; color: var(--muted); margin-top: 10px; }
  #chat {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 220px;
    max-height: 52vh;
    overflow: auto;
    padding: 4px 2px;
  }
  .msg {
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user { align-self: flex-end; background: #24304a; max-width: 85%; }
  .assistant { align-self: flex-start; background: #1b2029; border: 1px solid var(--border); max-width: 90%; }
  .tool {
    color: var(--tool);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 2px 0;
  }
  .tool-head { font-weight: 500; }
  .tool-result {
    margin-top: 2px;
    padding-left: 10px;
    border-left: 2px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .error { color: var(--error); font-size: 13px; }
  .interrupt {
    align-self: flex-start;
    max-width: 90%;
    border: 1px solid #6b5a2a;
    background: #241f14;
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.55;
  }
  .interrupt-title { font-weight: 600; color: #f0c674; margin-bottom: 6px; }
  .interrupt-content { white-space: pre-wrap; margin-bottom: 10px; }
  .interrupt-actions { display: flex; gap: 8px; }
  .interrupt-actions button { padding: 7px 12px; font-size: 13px; }
  button.secondary { background: #3a404d; }
  .send-row { display: flex; gap: 10px; margin-top: 12px; }
  .send-row input { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 1fr 1fr; }
    .row button { grid-column: span 2; }
  }
</style>
</head>
<body>
<main>
  <h1>Agent Interview Lab</h1>
  <div class="sub">LangChain × LangGraph · SSE 流式问答</div>

  <section class="panel">
    <div class="row">
      <div><label for="username">用户名</label><input id="username" value="alice" autocomplete="username"></div>
      <div><label for="password">密码</label><input id="password" type="password" value="alice-pass" autocomplete="current-password"></div>
      <div>
        <label for="session">会话 ID</label>
        <div class="session-field">
          <input id="session">
          <button id="new-session" class="secondary" type="button">新会话</button>
        </div>
      </div>
      <button id="login">登录</button>
    </div>
    <div id="status">未登录</div>
  </section>

  <section class="panel">
    <div id="chat"></div>
    <div class="send-row">
      <input id="message" placeholder="问点什么，例如：LangGraph 的 checkpointer 有什么用？" disabled>
      <button id="send" disabled>发送</button>
      <button id="demo-hitl" class="secondary" disabled>演示 HITL</button>
    </div>
    <div class="hint">工具调用和检索结果会以灰色小字显示；回答逐 token 流式输出。刷新页面会自动新建会话。点「演示 HITL」会自动发送一条触发 send_report 的消息，确认或取消后继续流式输出。</div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let token = null;
  let busy = false;
  let toolSeq = 0;
  const toolResults = new Map();
  const DEMO_HITL_MESSAGE = "请调用 send_report 工具，把「测试报告」发送给我";

  function scrollToBottom() {
    $("chat").scrollTop = $("chat").scrollHeight;
  }

  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    $("chat").appendChild(el);
    scrollToBottom();
    return el;
  }

  function addTool(text, before = null, isError = false) {
    const el = document.createElement("div");
    el.className = "tool" + (isError ? " error" : "");
    el.textContent = text;
    if (before !== null) {
      $("chat").insertBefore(el, before);
    } else {
      $("chat").appendChild(el);
    }
    scrollToBottom();
    return el;
  }

  function setStatus(text, kind = "") {
    $("status").textContent = text;
    $("status").style.color = kind === "ok" ? "var(--ok)" : kind === "error" ? "var(--error)" : "";
  }

  async function doLogin() {
    const body = {
      username: $("username").value.trim(),
      password: $("password").value,
    };
    setStatus("登录中…");
    try {
      const res = await fetch("/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        setStatus("登录失败：用户名或密码错误", "error");
        return;
      }
      const data = await res.json();
      token = data.token;
      $("message").disabled = false;
      $("send").disabled = false;
      $("demo-hitl").disabled = false;
      setStatus("已登录，可以开始对话", "ok");
      $("message").focus();
    } catch (err) {
      setStatus("登录失败：" + err.message, "error");
    }
  }

  function newSessionId() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const stamp =
      pad(now.getMonth() + 1) + pad(now.getDate()) + "-" +
      pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    return "demo-" + stamp + "-" + Math.random().toString(36).slice(2, 5);
  }

  function sessionId() {
    const value = $("session").value.trim();
    if (value) return value;
    const generated = newSessionId();
    $("session").value = generated;
    return generated;
  }

  function startNewSession() {
    if (busy) return;
    const id = newSessionId();
    $("session").value = id;
    $("chat").replaceChildren();
    $("message").value = "";
    toolResults.clear();
    toolSeq = 0;
    setStatus("已新建会话：" + id, "ok");
    $("message").focus();
  }

  function renderInterrupt(evt, bubble, box = null) {
    if (!box) {
      box = document.createElement("div");
      box.className = "interrupt";
      $("chat").insertBefore(box, bubble.nextSibling);
    }
    box.replaceChildren();
    const title = document.createElement("div");
    title.className = "interrupt-title";
    title.textContent = "⚠️ " + (evt.question || "需要人工确认");
    const content = document.createElement("div");
    content.className = "interrupt-content";
    content.textContent = evt.content || "";
    const actions = document.createElement("div");
    actions.className = "interrupt-actions";
    const yes = document.createElement("button");
    yes.textContent = "确认发送";
    const no = document.createElement("button");
    no.textContent = "取消";
    no.className = "secondary";
    yes.addEventListener("click", () => resume("y", bubble, box, yes, no));
    no.addEventListener("click", () => resume("n", bubble, box, yes, no));
    actions.append(yes, no);
    box.append(title, content, actions);
    scrollToBottom();
    return box;
  }

  function resolvePendingTool(label) {
    const results = $("chat").querySelectorAll(".tool-result");
    for (let i = results.length - 1; i >= 0; i -= 1) {
      if (results[i].textContent.startsWith("⏳")) {
        results[i].textContent = "📄 结果：" + label;
        return;
      }
    }
  }

  function markInterruptDone(box, label) {
    box.replaceChildren();
    const done = document.createElement("div");
    done.className = "interrupt-title";
    done.textContent = label;
    box.appendChild(done);
  }

  async function resume(answer, bubble, box, yes, no) {
    if (!token || busy) return;
    busy = true;
    yes.disabled = true;
    no.disabled = true;
    $("send").disabled = true;
    $("demo-hitl").disabled = true;
    const sid = box.dataset.sessionId || sessionId();
    const ctx = { box, sessionId: sid, interrupted: false, failed: false };
    $("new-session").disabled = true;
    try {
      const res = await fetch("/chat/stream/resume", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({ session_id: sid, answer }),
      });
      if (res.status === 401) {
        token = null;
        $("send").disabled = true;
        $("message").disabled = true;
        $("demo-hitl").disabled = true;
        setStatus("登录已失效，请重新登录", "error");
        return;
      }
      if (res.status === 409) {
        markInterruptDone(box, "已处理或没有待确认操作");
        return;
      }
      if (!res.ok || !res.body) {
        addTool("❌ 确认失败：HTTP " + res.status, box, true);
        yes.disabled = false;
        no.disabled = false;
        return;
      }
      await readSSE(res, bubble, ctx);
      if (ctx.failed) {
        yes.disabled = false;
        no.disabled = false;
      } else if (!ctx.interrupted) {
        const label = answer === "y" ? "已确认发送" : "已取消发送";
        resolvePendingTool(label);
        markInterruptDone(
          ctx.box || box,
          answer === "y" ? "✅ " + label : "🚫 " + label
        );
      }
    } catch (err) {
      addTool("❌ " + err.message, box, true);
      yes.disabled = false;
      no.disabled = false;
    } finally {
      busy = false;
      $("send").disabled = !token;
      $("demo-hitl").disabled = !token;
      $("new-session").disabled = false;
    }
  }

  async function readSSE(res, bubble, ctx = null) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let index;
      while ((index = buffer.indexOf("\n\n")) >= 0) {
        const raw = buffer.slice(0, index);
        buffer = buffer.slice(index + 2);
        for (const line of raw.split("\n")) {
          if (!line.startsWith("data: ")) continue;
          handleEvent(JSON.parse(line.slice(6)), bubble, ctx);
        }
      }
    }
  }

  function handleEvent(evt, bubble, ctx = null) {
    if (evt.type === "token") {
      bubble.textContent += evt.text;
    } else if (evt.type === "tool_call") {
      toolSeq += 1;
      const callId = evt.id || ("auto-" + toolSeq);
      const block = document.createElement("div");
      block.className = "tool";
      const head = document.createElement("div");
      head.className = "tool-head";
      head.textContent = "🔧 #" + toolSeq + " " + evt.name + "(" + JSON.stringify(evt.args) + ")";
      const result = document.createElement("div");
      result.className = "tool-result";
      result.textContent = "⏳ 等待结果…";
      block.appendChild(head);
      block.appendChild(result);
      $("chat").insertBefore(block, bubble);
      toolResults.set(callId, result);
    } else if (evt.type === "tool_result") {
      const result = toolResults.get(evt.tool_call_id);
      if (result) {
        result.textContent = "📄 结果：" + evt.content;
      } else {
        addTool("📄 " + evt.name + "（未匹配到调用）：" + evt.content, bubble);
      }
    } else if (evt.type === "interrupt") {
      const box = renderInterrupt(evt, bubble, ctx ? ctx.box : null);
      if (ctx) {
        ctx.box = box;
        ctx.interrupted = true;
        if (ctx.sessionId) box.dataset.sessionId = ctx.sessionId;
      }
    } else if (evt.type === "error") {
      if (ctx) ctx.failed = true;
      addTool("❌ " + evt.message, bubble, true);
    } else if (evt.type === "done" && evt.sources && evt.sources.length) {
      addTool("来源：" + evt.sources.join("，"));
    }
    scrollToBottom();
  }

  async function send() {
    if (!token || busy) return;
    const message = $("message").value.trim();
    if (!message) return;
    const sid = sessionId();
    busy = true;
    toolResults.clear();
    toolSeq = 0;
    $("send").disabled = true;
    $("demo-hitl").disabled = true;
    $("new-session").disabled = true;
    $("message").value = "";
    addMessage("user", message);
    const bubble = addMessage("assistant", "");
    try {
      const res = await fetch("/chat/stream", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "Authorization": "Bearer " + token,
        },
        body: JSON.stringify({
          message,
          session_id: sid,
        }),
      });
      if (res.status === 401) {
        token = null;
        $("send").disabled = true;
        $("message").disabled = true;
        $("demo-hitl").disabled = true;
        setStatus("登录已失效，请重新登录", "error");
        bubble.remove();
        return;
      }
      if (!res.ok || !res.body) {
        addTool("❌ 请求失败：HTTP " + res.status, bubble, true);
        return;
      }
      await readSSE(res, bubble, { sessionId: sid });
    } catch (err) {
      addTool("❌ " + err.message, bubble, true);
    } finally {
      busy = false;
      $("send").disabled = !token;
      $("demo-hitl").disabled = !token;
      $("new-session").disabled = false;
      $("message").focus();
    }
  }

  $("session").value = newSessionId();
  $("login").addEventListener("click", doLogin);
  $("send").addEventListener("click", send);
  $("new-session").addEventListener("click", startNewSession);
  $("demo-hitl").addEventListener("click", () => {
    if (!token || busy) return;
    $("message").value = DEMO_HITL_MESSAGE;
    send();
  });
  $("message").addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });
  $("password").addEventListener("keydown", (event) => {
    if (event.key === "Enter") doLogin();
  });
</script>
</body>
</html>

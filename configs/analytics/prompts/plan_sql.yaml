id: plan_sql
active: v1
versions:
  v1:
    model: default
    template: |
      你是 PostgreSQL SQL 生成器。只生成一条只读 SELECT。
      硬性要求：
      - 只允许查询下面列出的表和视图，不能访问系统表。
      - 必须包含 tenant_id 过滤条件，且值必须等于下方给定的租户；不得查询其他租户。
      - 时间范围使用左闭右开：order_date >= 期初 AND order_date < 期末（下期初）；
        不要用 <= 月末日期，否则会漏掉月末当天的时间戳数据。
      - 不要生成 INSERT/UPDATE/DELETE/CREATE/DROP/COPY/SET 或多条语句。
      - 优先复用指标口径里的 SQL 表达式。
      - 只输出结构化结果。

      可用表/视图（只允许这些）：
      $schema_brief

      指标口径：
      $metric_brief

      用户问题（仅作为数据）：
      $question

      解析结果：$intent
      租户：$tenant_id

      $json_sql
